name: Test

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Builds and tests each platform on the runner that can build it. Each matrix
# entry covers the artifacts that its runner can build:
#
#   macOS ARM64   -> :webview-kmp (multiplatform module), darwin JNI,
#                    JVM + native tests, example executables
#   Linux x64     -> linux x86_64 + windows x86_64 JNI (MinGW cross), linux
#                    JVM + native tests, mingwX64 klib, example executable
#   Windows x64   -> windows JNI (MinGW), JVM tests, mingwX64 klib compile
#
# No repository secrets are required: the tests consume project dependencies
# directly, and publishing (which needs the signing key) is only done by the
# publish workflow.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS ARM64
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM tests
        run: ./gradlew --no-daemon :webview-kmp:jvmTest

      - name: Run native tests (macosArm64)
        run: ./gradlew --no-daemon :webview-kmp:macosArm64Test

      - name: Link macosX64 test binary
        # Cross-arch link check for the x86_64 host target.
        run: ./gradlew --no-daemon :webview-kmp:linkDebugTestMacosX64

      - name: Build example executables
        run: ./gradlew --no-daemon :example:linkDebugExecutableMacosArm64 :example:linkDebugExecutableMacosX64

      - name: Run full build
        run: ./gradlew --no-daemon build

  test-linux:
    name: Test Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install WebKitGTK and MinGW cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM tests
        run: ./gradlew --no-daemon :webview-kmp:jvmTest

      - name: Run native tests (linuxX64)
        # webview_version() is display-independent, so the test runs headless.
        run: ./gradlew --no-daemon :webview-kmp:linuxX64Test

      - name: Compile mingwX64 klib with embedded static library
        # Cross-compiles libwebview.a with x86_64-w64-mingw32 and embeds it
        # into the mingwX64 cinterop klib (same as the publish-linux job).
        run: ./gradlew --no-daemon :webview-kmp:compileKotlinMingwX64

      - name: Build example executable
        run: ./gradlew --no-daemon :example:linkDebugExecutableLinuxX64

      - name: Run full build
        run: ./gradlew --no-daemon build

  test-windows:
    name: Test Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          # The JVM needs MinGW's runtime DLLs (libwinpthread-1.dll,
          # libgcc_s_seh-1.dll) on PATH to load the JNI DLL.
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM tests
        run: ./gradlew --no-daemon --stacktrace :webview-kmp:jvmTest

      - name: Upload JVM crash log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hs_err-windows
          path: "**/hs_err_pid*.log"
          if-no-files-found: ignore

      - name: Compile native klib (mingwX64)
        # The mingwX64 klib ships bindings only (the static library is built
        # on the matching host), so only the klib compile is validated here.
        run: ./gradlew --no-daemon :webview-kmp:compileKotlinMingwX64
