name: Publish

"on":
  workflow_dispatch:

# Publishes every artifact from the runner that can build it. Maven Central
# coordinates are immutable, so each publication is produced by exactly one
# runner:
#
#   macos-14           -> :webview-kmp metadata + jvm + macos klibs, and
#                         :jni-jvm-darwin-aarch64, :jni-jvm-darwin-x86_64
#   ubuntu-latest      -> :webview-kmp linuxX64/mingwX64 klibs (with the
#                         embedded static library, cross-compiled), and
#                         :jni-jvm-linux-x86_64, :jni-jvm-windows-x86_64
#   ubuntu-latest      -> :webview-kmp linuxArm64 klib (cross-compiled with
#                         the aarch64-linux-gnu toolchain + arm64 WebKitGTK
#                         via multiarch; Kotlin/Native has no linux-aarch64
#                         host), and :jni-jvm-linux-aarch64
#   (linuxArm64 is a separate job because webkit2gtk's -dev packages
#   conflict across architectures)
#
# The kotlinMultiplatform metadata module (published from macOS) redirects to
# the per-target klib modules, so all of them must be published before
# consumers can resolve the artifact.
#
# Trigger: run manually via the Actions tab. Version is fixed in the root
# build.gradle.kts; bump it before releasing again, since Maven Central does
# not allow republishing a version.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MAVEN_CENTRAL_USERNAME   Sonatype Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD   Sonatype Central Portal user-token password
#   SIGNING_KEY              base64-encoded PGP secret key ring (.gpg, binary)
#   SIGNING_KEY_ID           8-hex-digit key id (without the 0x prefix)
#   SIGNING_PASSWORD         Passphrase of the signing key

jobs:
  publish-macos:
    name: Publish macOS (metadata + jvm + Apple klibs + darwin JNI)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      # Per-target publications are used instead of
      # publishAllPublicationsToMavenCentralRepository so that the linux /
      # mingw klibs (built with their embedded static library on the Linux
      # runners) are not published from here as bindings-only klibs. The
      # kotlinMultiplatform metadata module is published last since it
      # redirects consumers to the per-target modules.
      - name: Publish jvm, macos target klibs and darwin JNI
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :webview-kmp:publishJvmPublicationToMavenCentralRepository
          :webview-kmp:publishMacosArm64PublicationToMavenCentralRepository
          :webview-kmp:publishMacosX64PublicationToMavenCentralRepository
          :jni-jvm-darwin-aarch64:publishToMavenCentral
          :jni-jvm-darwin-x86_64:publishToMavenCentral
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Publish kotlinMultiplatform metadata last
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :webview-kmp:publishKotlinMultiplatformPublicationToMavenCentralRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-linux:
    name: Publish Linux x64 (linuxX64/mingwX64 klibs + linux and windows JNI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install WebKitGTK and MinGW cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish linuxX64/mingwX64 klibs and linux + windows JNI
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :webview-kmp:publishLinuxX64PublicationToMavenCentralRepository
          :webview-kmp:publishMingwX64PublicationToMavenCentralRepository
          :jni-jvm-linux-x86_64:publishToMavenCentral
          :jni-jvm-windows-x86_64:publishToMavenCentral
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-linux-arm64:
    name: Publish Linux ARM64 (linuxArm64 klib + linux aarch64 JNI)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install ARM64 cross toolchain and WebKitGTK
        run: |
          sudo dpkg --add-architecture arm64
          # The default Ubuntu mirrors only host amd64; restrict them to
          # amd64 and add Ubuntu's ports mirror for the arm64 packages.
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/ubuntu.list
          echo "deb [arch=amd64] http://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/ubuntu.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/ubuntu.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 \
            libgtk-3-dev:arm64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish linuxArm64 klib and linux aarch64 JNI
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :webview-kmp:publishLinuxArm64PublicationToMavenCentralRepository
          :jni-jvm-linux-aarch64:publishToMavenCentral
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
